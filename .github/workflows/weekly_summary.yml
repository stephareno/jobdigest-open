name: Weekly Job Digest Summary

# Schedule (PUB-08): `python main.py cron --write` writes the schedule: block:
# delivery.weekly_summary_day at delivery.weekly_summary_time_local in
# delivery.timezone, off the top of the hour like the other crons, one line per
# UTC offset the zone uses. Every line fires; the first job (`slot`) lets only
# today's line through, so the DST twin ends before the summary job starts. A test fails if the block
# differs from what the command generates.
#
# Saturday is the one day with no digest (GAP-08). On the old Friday slot
# the 06:17 UTC digest had to beat 12:00 UTC to be counted, and GitHub
# queue delay on this repo runs to 5.7 h worst case; running a day later
# gives the Friday digest a full day to land and write its rows before the
# summary reads the Sheet. The window still covers the Sunday–Friday week
# that just ended — see LOOKBACK_DAYS in weekly_summary.py.

on:
  # generated by `python main.py cron --write` from profile.yaml; do not hand-edit
  schedule:
    - cron: '57 13 * * 6'   # 08:00 America/Chicago when it is UTC-06:00
    - cron: '57 12 * * 6'   # 08:00 America/Chicago when it is UTC-05:00
  workflow_dispatch:

jobs:
  # PUB-06: the slot guard runs here, in its own job with no concurrency
  # group, so a DST twin never waits in (or cancels a run queued in) the
  # repo-state-writers group. It checks out only what the guard reads and
  # outputs run=true|false; workflow_dispatch skips the check and runs.
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - name: Checkout the guard's files
        if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            main.py
            cli.py
            envfile.py
            sheet_layout.py
            company_lists.py
            schedule.py
            profile_loader.py
            places.py
            config.py
            profile.yaml
            requirements.lock
            sources/
            data/

      - name: Set up Python
        if: github.event_name == 'schedule'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Is this the intended slot?
        id: guard
        env:
          # The cron line that started this run (PUB-08).
          SCHEDULED_CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: no slot check"
            exit 0
          fi
          # PUB-21: PyYAML only, hash-checked from requirements.lock
          awk '/^pyyaml==/{p=1;print;next} p&&/^ /{print;next} {p=0}' requirements.lock > "$RUNNER_TEMP/slot.lock"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/slot.lock"
          python main.py slot weekly

  weekly-summary:
    needs: slot
    if: needs.slot.outputs.run == 'true'
    # Shares a group with daily.yml: no digest runs on Saturday, but both
    # workflows push state to main and either can be dispatched by hand, so
    # they queue one after the other instead of racing. Job level (PUB-06) so
    # the slot job above stays outside the group.
    concurrency:
      group: repo-state-writers
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main  # latest main when the job starts, not the trigger-time commit

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Run weekly summary
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        # The slot job has already decided this is the intended run.
        run: python weekly_summary.py

      - name: Commit skip-counter reset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add skip_state.json || true
          git diff --staged --quiet && exit 0
          git commit -m "Reset weekly skipped-day counter [skip ci]"
          # Another workflow can push between our rebase and our push; retry the
          # pair so that race cannot fail the run and drop this state commit.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt of 3 rejected; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::State commit could not be pushed after 3 attempts"
          exit 1
