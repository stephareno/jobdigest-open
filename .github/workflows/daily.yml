name: Job Digest Agent

# OPS-04: this workflow is the digest only. It emails and logs to the Sheet
# every posting that fetch runs (fetch.yml) have scored and queued in
# state/pending/, then dequeues them. Fetching and scoring happen in fetch.yml.
# Schedule and email format are unchanged from the single-run pipeline.
#
# Schedule (PUB-08): `python main.py cron --write` writes the schedule: block
# from the profile's delivery section (digest days, digest_time_local,
# timezone) and config.CRON_LEAD_MINUTES: each line fires 343 min before the
# digest time, sized for the 90th-percentile GitHub queue delay, not the
# median -- earlier is fine, late is not (CLAUDE.md rule 8). Off the top of the
# hour, where GitHub's scheduler is most congested. One line per UTC offset the
# zone uses; every line fires, and the first job (`slot`) lets only the line that
# is today's through: the DST twin ends there, before the digest job starts. A test
# fails if the block differs from what the command generates.

on:
  # generated by `python main.py cron --write` from profile.yaml; do not hand-edit
  schedule:
    - cron: '17 8 * * 0-5'   # 02:17 America/Chicago when it is UTC-06:00
    - cron: '17 7 * * 0-5'   # 02:17 America/Chicago when it is UTC-05:00
  workflow_dispatch:

jobs:
  # PUB-06: the slot guard runs here, in its own job with no concurrency
  # group, so a DST twin never waits in (or cancels a run queued in) the
  # repo-state-writers group. It checks out only what the guard reads and
  # outputs run=true|false; workflow_dispatch skips the check and runs.
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - name: Checkout the guard's files
        if: github.event_name == 'schedule'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            main.py
            cli.py
            envfile.py
            sheet_layout.py
            company_lists.py
            schedule.py
            profile_loader.py
            places.py
            config.py
            profile.yaml
            requirements.lock
            sources/
            data/

      - name: Set up Python
        if: github.event_name == 'schedule'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Is this the intended slot?
        id: guard
        env:
          # The cron line that started this run (PUB-08).
          SCHEDULED_CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: no slot check"
            exit 0
          fi
          # PUB-21: PyYAML only, hash-checked from requirements.lock
          awk '/^pyyaml==/{p=1;print;next} p&&/^ /{print;next} {p=0}' requirements.lock > "$RUNNER_TEMP/slot.lock"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/slot.lock"
          python main.py slot digest

  run-digest:
    needs: slot
    if: needs.slot.outputs.run == 'true'
    # Digest and weekly-summary runs both write skip_state.json. One at a time,
    # so neither push races the other; a queued run waits rather than
    # cancelling the one in progress. Job level (PUB-06) so the slot job above
    # stays outside the group. fetch.yml is deliberately in a different group:
    # it never writes a file this workflow writes (it only adds new files to
    # state/pending/, this workflow only deletes files it read), so the two can
    # overlap safely and a queued fetch can never cancel a pending digest.
    concurrency:
      group: repo-state-writers
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30  # no job fetching here: company profiles (DEL-14, capped at PROFILE_BUDGET_SECS), Sheet writes, email, applied-seed and status tracking
    permissions:
      contents: write
      actions: read   # fetch.yml run outcomes for the failed-run banner (OPS-12)
      checks: read    # their ::error:: annotations
    env:
      # Actions pipes stdout, so Python block-buffers it: a killed run lost
      # everything after its last flush (2026-09-10). Unbuffered = every line
      # lands with its real timestamp.
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main  # latest main when the job starts, not the trigger-time commit

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Collect fetch run outcomes since the last digest
        # OPS-12: every fetch.yml run since the previous digest, with its
        # conclusion and ::error:: title. The digest shows a red banner per
        # failed or cancelled run. Informational only: if this step fails the
        # digest still sends, without the banner, and logs a warning.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_run_outcomes.py "$RUNNER_TEMP/fetch_runs.json"

      - name: Run job digest agent
        env:
          FETCH_RUNS_FILE: ${{ runner.temp }}/fetch_runs.json
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Still read at import time by the source modules main.py imports.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
        # The slot job has already decided this is the intended run.
        run: python main.py digest

      - name: Commit dequeued batches, skip counter and caches
        # always(): a digest that failed after sending must still commit the
        # dequeue, or the next digest re-sends. A digest that failed before
        # sending never dequeued, so its batches stay queued either way.
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add skip_state.json || true
          # DEL-14: company profile cache, written by the digest only.
          git add company_profiles.json || true
          # TRK-12: status-email decision cache, written by the digest only.
          git add status_email_cache.json || true
          # -A stages the deletions of the batches this digest sent.
          git add -A state/pending || true
          git diff --staged --quiet && exit 0
          git commit -m "Digest sent: dequeue batches, update skip counter, profiles and status cache [skip ci]"
          # main may have moved during the run; rebase so the push fast-forwards.
          # Never "|| true": a lost state commit means tomorrow re-sends today's
          # jobs, so it must fail the run visibly.
          # Another workflow can push between our rebase and our push; retry the
          # pair so that race cannot fail the run and drop this state commit.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt of 3 rejected; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::State commit could not be pushed after 3 attempts"
          exit 1
