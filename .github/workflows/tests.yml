# PUB-21: the test suite on every push and pull request, on the example
# profile, with no secrets. It needs nothing from the repository owner: no
# profile.yaml of your own, no keys, no Sheet. Installs from the hashed lock
# file (tools/requirements.lock: the engine's packages plus pytest).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (hash-checked)
        run: pip install --require-hashes -r tools/requirements.lock

      - name: Run the suite on the example profile
        env:
          JOB_DIGEST_PROFILE: profile.example.yaml
          PYTHONUNBUFFERED: "1"
        run: python -m pytest -q
