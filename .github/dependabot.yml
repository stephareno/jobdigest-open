# PUB-21: monthly update pull requests for the GitHub Actions the workflows
# use (pinned to full commit SHAs), grouped into one PR. Python packages are
# not here on purpose: the workflows install the hash-pinned lock files, which
# a Dependabot pip PR would leave stale. Update them by hand with
# tools/lock.sh (see "Dependencies" in AGENTS.md).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
